name: Build C++ EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Chatbot
        run: g++ -static main.cpp -o my_chatbot.exe
      
      - name: Upload EXE
        uses: actions/upload-artifact@v4  # Updated from v3 to v4
        with:
          name: chatbot-download
          path: my_chatbot.exe
          # Optional: Keep the file for 30 days (default is 90)
          retention-days: 30    
