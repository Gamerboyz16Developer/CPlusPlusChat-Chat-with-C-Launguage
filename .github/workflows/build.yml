name: Build C++ EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 and GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add GCC to PATH
        shell: msys2 {0}
        run: |
          echo "/ucrt64/bin" >> $GITHUB_PATH

      - name: Compile Chatbot
        shell: msys2 {0}
        run: |
          g++ -static main.cpp -o my_chatbot.exe
          ls -l my_chatbot.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-download
          path: my_chatbot.exe
          retention-days: 30   
